name: Send Scheduled Reminders

# Runs every 15 minutes, calling the backend's reminder-scan endpoint.
# This is what actually makes session/check-in/habit/nutrition/sync
# reminders happen — without this trigger, the scan logic exists but
# nothing ever calls it.
#
# REQUIRED SETUP before this works:
#   1. On Railway (backend service): set REMINDER_CRON_SECRET to any
#      random string (e.g. generate one with `openssl rand -hex 32`).
#   2. On GitHub: Settings -> Secrets and variables -> Actions -> New
#      repository secret, name it REMINDER_CRON_SECRET, same value.
#   3. Also set a repository secret named BACKEND_URL to your Railway
#      backend's base URL, e.g. https://just-perception-production.up.railway.app
#
# If either secret is missing, this workflow will fail loudly in the
# Actions tab rather than silently doing nothing — check there if
# reminders don't seem to be arriving.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button, useful for testing on demand

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder scan endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.BACKEND_URL }}/api/notification-preferences/run-reminders" \
            -H "X-Cron-Secret: ${{ secrets.REMINDER_CRON_SECRET }}")
          echo "HTTP status: $response"
          cat /tmp/response.json
          if [ "$response" -ne 200 ]; then
            echo "Reminder scan failed"
            exit 1
          fi
