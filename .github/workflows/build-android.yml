name: Build Android APK

# Builds a debug APK automatically on every push to main, plus lets you
# trigger a build manually from the Actions tab anytime (workflow_dispatch).
#
# IMPORTANT — this produces a DEBUG-signed APK, not a release build:
#   - Fine for installing on your own phone/testing, NOT for Play Store.
#   - Signed with Android's default auto-generated debug key, which is
#     DIFFERENT from whatever key any previously-installed build used
#     (e.g. one built locally in Android Studio). Android will refuse to
#     install this as an "update" over an existing install with a
#     different signature — uninstall the old app first if this happens.
#   - If/when you want real release builds (Play Store-ready, consistent
#     signing across builds), that needs a release keystore added as a
#     GitHub Secret — a separate, one-time setup we can do when you're
#     ready to publish rather than just test.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # adds a manual "Run workflow" button in the Actions tab

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build web assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coachme-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
